name: Test

on: [push, pull_request]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "${{ matrix.python-version }}"
          activate-environment: true
          enable-cache: true
      - name: Install Dependencies
        # CPU-only PyTorch wheels, avoids pulling in the CUDA/nvidia packages
        run: |
          uv pip install --torch-backend cpu -e ".[test]"
      - name: Restore pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-cache-${{ github.ref }}-${{ matrix.python-version }}
          restore-keys: |
            pytest-cache-refs/heads/main-${{ matrix.python-version }}
      - name: Run test
        run: |
          make test

      - name: Test coveralls - python ${{ matrix.python-version }}
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          flag-name: run-${{ matrix.python-version }}
          parallel: true
