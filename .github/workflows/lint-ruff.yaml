name: Lint-ruff

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --preview"
      - name: Run ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"
