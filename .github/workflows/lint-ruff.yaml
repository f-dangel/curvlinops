name: Lint-ruff

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check --preview"
      - name: Run ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check --diff"
